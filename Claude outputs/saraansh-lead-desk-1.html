<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Saraansh Sales CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f2f3f8; --surface-3:#e9ebf3;
    --border:#e6e8f1; --border-strong:#d2d6e4;
    --ink:#1e2233; --muted:#5b6379; --faint:#9096a8;
    --primary:#5a3fd6; --primary-dark:#472fb0; --primary-soft:#eeeafc; --on-primary:#ffffff;
    --gold:#b58a3c; --gold-soft:#f5edda;
    --hot:#d8383d; --hot-bg:#fceceb;
    --warm:#c07200; --warm-bg:#fbf1df;
    --cold:#2b74d6; --cold-bg:#e7f0fc;
    --good:#0f9d58; --good-bg:#e5f5ec;
    --violet:#6a49c8; --violet-bg:#efeafc;
    --teal:#0d8a8a; --teal-bg:#e2f4f4;
    --slate:#5b6577; --slate-bg:#eceff5;
    --shadow:0 1px 2px rgba(20,30,60,.05), 0 8px 24px rgba(20,30,60,.06);
    --shadow-sm:0 1px 2px rgba(20,30,60,.06);
    --r:10px; --r-sm:7px;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --display:"Inter",var(--sans);
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme:dark){
      --bg:#081518; --surface:#0e2328; --surface-2:#123037; --surface-3:#18404a;
      --border:#1e434c; --border-strong:#2d5b66;
      --ink:#eaf4f4; --muted:#9fb9bd; --faint:#6d8a90;
      --primary:#3aa9bc; --primary-dark:#2b8698; --primary-soft:#0f2a31; --on-primary:#04191d;
      --gold:#d8b678; --gold-soft:#2a2415;
      --hot:#f0666a; --hot-bg:#3a1c1e; --warm:#e0a341; --warm-bg:#332711;
      --cold:#5db3d0; --cold-bg:#0f2b38; --good:#3ec08a; --good-bg:#0f2e24;
      --violet:#a78ef0; --violet-bg:#241c44; --teal:#43b9b0; --teal-bg:#0d2e2c;
      --slate:#8fa6ab; --slate-bg:#16323a;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.5);
      --shadow-sm:0 1px 2px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#081518; --surface:#0e2328; --surface-2:#123037; --surface-3:#18404a;
    --border:#1e434c; --border-strong:#2d5b66;
    --ink:#eaf4f4; --muted:#9fb9bd; --faint:#6d8a90;
    --primary:#3aa9bc; --primary-dark:#2b8698; --primary-soft:#0f2a31; --on-primary:#04191d;
    --gold:#d8b678; --gold-soft:#2a2415;
    --hot:#f0666a; --hot-bg:#3a1c1e; --warm:#e0a341; --warm-bg:#332711;
    --cold:#5db3d0; --cold-bg:#0f2b38; --good:#3ec08a; --good-bg:#0f2e24;
    --violet:#a78ef0; --violet-bg:#241c44; --teal:#43b9b0; --teal-bg:#0d2e2c;
    --slate:#8fa6ab; --slate-bg:#16323a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;letter-spacing:-.01em}
  img{max-width:100%}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .mono{font-family:var(--mono)}
  .tnum{font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
  .brand-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#b98f4e);color:#14100a;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none}
  .brand-name{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em}
  .brand-sub{font-size:10.5px;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .navgroup{padding:6px 12px}
  .navlabel{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:12px 10px 6px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;border:none;background:none;width:100%;text-align:left;transition:.12s}
  .navitem:hover{background:var(--surface-2);color:var(--ink)}
  .navitem.active{background:var(--primary);color:var(--on-primary);font-weight:600;box-shadow:var(--shadow-sm)}
  .navitem svg{width:18px;height:18px;flex:none}
  .navitem .cnt{margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--muted);padding:1px 7px;border-radius:20px;font-weight:600}
  .navitem.active .cnt{background:rgba(255,255,255,.22);color:#fff}
  .sidefoot{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
  .userchip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm)}
  .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;color:#fff;background:var(--primary)}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:12px 22px}
  .search{flex:1;max-width:460px;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--faint)}
  .search input{border:none;background:none;outline:none;color:var(--ink);flex:1;font-size:13px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;color:var(--muted)}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
  .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
  .iconbtn:hover{color:var(--ink);border-color:var(--border-strong)}
  select.roleselect{border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:7px 10px;font-weight:600;font-size:12.5px;font-family:inherit;outline:none;max-width:190px}
  .content{padding:24px 22px 60px;max-width:1220px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .page-head h1{font-size:26px;font-weight:700}
  .page-head .sub{color:var(--muted);margin-top:3px}

  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:9px 15px;font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--ink);transition:.12s}
  .btn:hover{border-color:var(--border-strong)}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-sm)}
  .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.sm{padding:6px 11px;font-size:12px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{border-radius:var(--r);padding:18px;color:#fff;position:relative;overflow:hidden;min-height:104px;box-shadow:var(--shadow)}
  .kpi .k-ico{position:absolute;right:14px;top:14px;opacity:.9}
  .kpi .k-ico svg{width:30px;height:30px}
  .kpi .k-lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.92}
  .kpi .k-val{font-family:var(--display);font-size:32px;font-weight:700;margin-top:8px;letter-spacing:-.02em}
  .kpi .k-sub{font-size:11.5px;opacity:.85;margin-top:2px}
  .kpi.blue{background:linear-gradient(135deg,#2b93a6,#0f4954)}
  .kpi.pink{background:linear-gradient(135deg,#c25570,#7e2f46)}
  .kpi.amber{background:linear-gradient(135deg,#d99a3f,#9a6316)}
  .kpi.green{background:linear-gradient(135deg,#2fa87c,#0d6b4d)}

  .grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .panel-head .pt{display:flex;align-items:center;gap:9px}
  .panel-head h3{font-size:15px}
  .panel-head .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .badge-live{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--good);background:var(--good-bg);padding:3px 8px;border-radius:20px}

  .barrow{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:10px;margin:9px 0;font-size:12.5px}
  .barrow .bl{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{height:9px;background:var(--surface-2);border-radius:20px;overflow:hidden}
  .barfill{height:100%;border-radius:20px}
  .barrow .bv{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .spark{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
  .spark .sb{flex:1;background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 55%,transparent));border-radius:4px 4px 2px 2px;min-height:3px}
  .spark .sb:hover{background:var(--primary-dark)}
  .sparkx{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);margin-top:6px}
  .donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .donut{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center}
  .donut .hole{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
  .donut .hole b{font-family:var(--display);font-size:20px}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;flex:1;min-width:150px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
  .legend .lv{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}

  .tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:14px;scrollbar-width:thin}
  .tab{white-space:nowrap;padding:9px 13px;border:none;background:none;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent;border-radius:8px 8px 0 0}
  .tab:hover{color:var(--ink);background:var(--surface-2)}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
  .tab .tc{font-size:11px;background:var(--surface-3);color:var(--muted);padding:0 6px;border-radius:20px;margin-left:5px;font-weight:700}
  .tab.active .tc{background:var(--primary-soft);color:var(--primary)}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .selin{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 11px;font-weight:600;font-size:12.5px;font-family:inherit;outline:none}

  .tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
  .tablescroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  thead th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:.1s}
  tbody tr:hover{background:var(--surface-2);cursor:pointer}
  .lead-cell{display:flex;align-items:center;gap:11px}
  .lead-cell .avatar{width:38px;height:38px;font-size:13px}
  .lead-name{font-weight:600;color:var(--ink)}
  .lead-meta{font-size:11.5px;color:var(--faint);margin-top:1px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .chip .cd{width:6px;height:6px;border-radius:50%}
  .agent-cell{display:flex;align-items:center;gap:8px}
  .agent-cell .avatar{width:26px;height:26px;font-size:10px;background:var(--slate)}
  .src{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:6px}
  .created{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .empty{padding:56px 20px;text-align:center;color:var(--muted)}
  .empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:10px}

  .back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;background:none;border:none;margin-bottom:14px}
  .back:hover{color:var(--ink)}
  .lead-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .lead-hero .avatar{width:56px;height:56px;font-size:20px}
  .lead-hero h1{font-size:24px}
  .lead-hero .code{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .lead-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
  .contactbar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
  .contactbar .ci{background:var(--surface);padding:16px 18px}
  .contactbar .cl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .contactbar .cv{font-size:16px;font-weight:600;margin-top:5px}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr 300px;gap:14px;align-items:start}
  .meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
  .meta-row:last-child{border-bottom:none}
  .meta-row .ml{color:var(--muted)}
  .meta-row .mv{font-weight:600;text-align:right}
  .statusbig{text-align:center;padding:10px 0}
  .statusbig .sc{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px}
  .statusbig .sn{font-family:var(--display);font-size:20px;font-weight:700}
  .stage-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center}
  .stage-opt{font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
  .stage-opt:hover{border-color:var(--border-strong);color:var(--ink)}
  .timeline{position:relative;padding-left:26px;margin-top:6px}
  .timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--border)}
  .tl-item{position:relative;padding:0 0 16px}
  .tl-item:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-24px;top:2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--primary);color:var(--primary)}
  .tl-dot svg{width:10px;height:10px}
  .tl-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
  .tl-note{color:var(--muted);font-size:12.5px;margin-top:2px}
  .tl-time{color:var(--faint);font-size:11px;margin-top:2px}

  .stagelist{display:flex;flex-direction:column;gap:8px}
  .stage-item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;box-shadow:var(--shadow-sm)}
  .stage-item .handle{color:var(--faint);cursor:grab}
  .stage-item .sord{width:22px;height:22px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
  .stage-item .snm{font-weight:600;flex:1;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .stage-item .sdot{width:10px;height:10px;border-radius:50%}
  .toggle{width:40px;height:22px;border-radius:20px;background:var(--surface-3);border:none;position:relative;transition:.15s;flex:none}
  .toggle:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle.on{background:var(--good)}
  .toggle.on:after{left:20px}

  .modal-back{position:fixed;inset:0;background:rgba(15,20,35,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:18px}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.35);width:100%;max-width:680px;max-height:90vh;overflow-y:auto}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 24px 6px;gap:12px}
  .modal-head h2{font-size:20px}
  .modal-head .ms{color:var(--muted);font-size:13px;margin-top:3px}
  .modal-body{padding:16px 24px 24px}
  .form-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .form-sec-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding-bottom:9px;border-bottom:1px solid var(--border);margin-bottom:14px;color:var(--ink)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--muted)}
  .field label .req{color:var(--hot)}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;transition:.12s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .field textarea{resize:vertical;min-height:64px}
  .prio-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
  .prio-opt{border:1.5px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 6px;text-align:center;font-weight:700;font-size:11px;color:var(--muted);line-height:1.25}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}

  .repcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
  .rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
  .rank:last-child{border-bottom:none}
  .rank .rnum{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--surface-2);color:var(--muted)}
  .rank .rnum.top{background:var(--primary);color:#fff}
  .rank .rname{font-weight:600;flex:1;min-width:0}
  .rank .rstat{text-align:right;font-size:11.5px;color:var(--muted)}
  .rank .rstat b{color:var(--ink);font-size:14px;font-family:var(--display)}

  .toast{position:fixed;right:20px;bottom:20px;z-index:80;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:11px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .toast svg{width:17px;height:17px;color:var(--good)}
  .hint{font-size:11.5px;color:var(--faint);text-align:center;padding:14px 0 0}
  .demo-banner{background:var(--warm-bg);color:var(--warm);border:1px solid color-mix(in srgb,var(--warm) 30%,transparent);border-radius:10px;padding:9px 14px;font-size:12px;font-weight:600;margin-bottom:16px;display:flex;gap:8px;align-items:center}

  .menu-toggle{display:none}
  @media (max-width:960px){
    .grid2,.detail-grid{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid3{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:70;transform:translateX(-100%);transition:.2s}
    .sidebar.open{transform:none}
    .menu-toggle{display:grid}
    .form-cols{grid-template-columns:1fr;gap:0}
    .contactbar{grid-template-columns:1fr}
    .content{padding:18px 16px 50px}
  }

  /* --- interactive upgrades --- */
  .qa{display:flex;gap:6px}
  .qbtn{width:31px;height:31px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--muted);transition:transform .12s,background .12s,border-color .12s,color .12s}
  .qbtn svg{width:15px;height:15px}
  .qbtn:hover{transform:translateY(-1px)}
  .qbtn.call:hover{background:var(--cold-bg);color:var(--cold);border-color:var(--cold)}
  .qbtn.wa{color:#1f9d55}
  .qbtn.wa:hover{background:rgba(37,211,102,.14);border-color:#25d366;color:#128c4b}
  td.qa-cell{white-space:nowrap;width:1%}
  .callbtn:hover{background:var(--cold-bg);border-color:var(--cold);color:var(--cold)}
  .wabtn{color:#128c4b;border-color:color-mix(in srgb,#25d366 40%,var(--border))}
  .wabtn:hover{background:rgba(37,211,102,.12);border-color:#25d366;color:#0f7a41}
  .btn:active{transform:translateY(1px)}
  .kpi{transition:transform .16s ease,box-shadow .16s ease}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(20,30,60,.14)}
  tbody tr:hover .qbtn{border-color:var(--border-strong)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .content>*{animation:fadeUp .32s ease both}
  .kpis .kpi:nth-child(1){animation:fadeUp .3s ease both}
  .kpis .kpi:nth-child(2){animation:fadeUp .3s .05s ease both}
  .kpis .kpi:nth-child(3){animation:fadeUp .3s .1s ease both}
  .kpis .kpi:nth-child(4){animation:fadeUp .3s .15s ease both}
  .view-toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px}
  .view-toggle button{border:none;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .view-toggle button svg{width:15px;height:15px}
  .view-toggle button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .bcol{flex:0 0 268px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;max-height:72vh;transition:outline .12s}
  .bcol-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .bcol-h .sdot{width:9px;height:9px;border-radius:50%;flex:none}
  .bcol-h .bcount{margin-left:auto;background:var(--surface-3);color:var(--muted);border-radius:20px;padding:1px 9px;font-size:11px}
  .bcol-body{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .bcol.drop{outline:2px dashed var(--primary);outline-offset:-3px;background:var(--primary-soft)}
  .lcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:var(--shadow-sm);cursor:grab;transition:transform .12s,box-shadow .12s,border-color .12s}
  .lcard:active{cursor:grabbing}
  .lcard:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow)}
  .lcard-top{display:flex;align-items:center;gap:9px}
  .lcard-top .avatar{width:32px;height:32px;font-size:11px}
  .lcard-prop{font-size:12px;color:var(--muted);margin-top:8px}
  .lcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
  .bempty{color:var(--faint);font-size:12px;text-align:center;padding:18px 8px}
  #authroot{display:none}
  body.auth #app-root{display:none!important}
  body.auth #authroot{display:block}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1000px 520px at 50% -10%, color-mix(in srgb,var(--primary) 16%,var(--bg)), var(--bg))}
  .login-card{width:100%;max-width:404px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:30px 28px;border-top:3px solid var(--gold);animation:fadeUp .35s ease both}
  .login-brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}
  .login-demo{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
  .login-demo-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .demo-acc{display:flex;align-items:center;gap:11px;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:10px 12px;transition:.12s;width:100%}
  .demo-acc:hover{border-color:var(--primary);background:var(--primary-soft)}
  .logout-btn{margin-left:auto;width:32px;height:32px;flex:none}
  .logout-btn svg{width:16px;height:16px}
  .plogo{position:relative;width:42px;height:42px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);overflow:hidden;flex:none}
  .plogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:5px}
  .snap-prev{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px;white-space:pre-wrap;max-height:130px;overflow:auto;line-height:1.5}
  .snap-prev.empty{color:var(--faint);font-style:italic}
  .doc-chip{font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:2px 8px;border-radius:20px}
  .act-group{margin-bottom:20px}
  .act-group h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
  .act-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-left-width:4px;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:9px;flex-wrap:wrap}
  .act-card .due{font-size:12px;font-weight:700;text-align:right}
  .act-actions{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .rem-list{display:flex;flex-direction:column;gap:10px}
  .rem-item{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px}
  .rem-item .ra{margin-left:auto;display:flex;gap:6px;align-items:center}
  .stchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .chist{display:flex;flex-direction:column;position:relative;padding-left:26px}
  .chist:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border)}
  .chist-item{position:relative;padding-bottom:14px}
  .chist-item:last-child{padding-bottom:0}
  .chist-dot{position:absolute;left:-22px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--primary)}
  .chist-card{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 13px}
  .chist-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chist-time{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
  .chist-body{margin-top:8px;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 11px;white-space:pre-wrap;line-height:1.5}
  .chist-by{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .miniav{width:18px;height:18px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;flex:none;text-transform:uppercase}
  .shist{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:14px}
  .shist:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
  .shist-item{position:relative}
  .shist-dot{position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
  .shist-h{display:flex;align-items:center;gap:8px}
  .shist-d{margin-left:auto;font-size:10.5px;color:var(--faint);white-space:nowrap}
  .shist-c{font-size:12px;color:var(--muted);margin:3px 0}
  .form-sec-t svg{width:16px;height:16px;flex:none}
  .panel-head .pt svg{width:18px;height:18px;flex:none}
  .statusbig .sc svg{width:26px;height:26px}
  .back svg{width:16px;height:16px;flex:none}
  .lead-hero .lead-actions .btn svg{width:16px;height:16px}
  /* professional (Odoo/LeadRat) overrides */
  .kpi{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
  .kpi .k-lbl{color:var(--muted);opacity:1}
  .kpi .k-val{color:var(--ink)}
  .kpi .k-sub{color:var(--faint);opacity:1}
  .kpi .k-ico{top:16px;right:16px;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--kc,#5a3fd6) 15%,transparent);color:var(--kc,#5a3fd6);opacity:1}
  .kpi .k-ico svg{width:22px;height:22px}
  .kpi.blue{--kc:#3b5bd6}
  .kpi.pink{--kc:#d6467a}
  .kpi.amber{--kc:#c47d1e}
  .kpi.green{--kc:#2fa36b}
  .navitem.active{background:var(--primary-soft);color:var(--primary);box-shadow:none}
  .navitem.active .cnt{background:var(--primary);color:#fff}
  .brand-logo{background:linear-gradient(135deg,var(--primary),var(--primary-dark))!important;color:#fff!important}
  .brand-sub{color:var(--primary)}
  .btn.primary{box-shadow:none}
  .panel,.tablewrap,.repcard{box-shadow:var(--shadow-sm)}
  thead th{background:var(--surface-2);letter-spacing:.04em}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65}
  @media (min-width:761px){.scrim{display:none!important}}
  @media (max-width:760px){
    .topbar{padding:10px 14px;gap:8px}
    .search{min-width:0}
    .search input{min-width:0}
    #clock{display:none}
    select.roleselect{max-width:132px}
    .page-head h1{font-size:21px}
    .page-head{margin-bottom:16px}
    .lead-hero h1{font-size:20px}
    .lead-actions{margin-left:0;width:100%}
    .lead-actions .btn{flex:1 1 auto;justify-content:center}
    .kpi{min-height:92px;padding:15px}
    .kpi .k-val{font-size:26px}
    .modal{border-radius:14px}
  }
  @media (max-width:480px){
    .kpis{grid-template-columns:1fr}
    .tabs{gap:2px}
    .content{padding:16px 13px 44px}
    h1{letter-spacing:-.02em}
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes modalPop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .modal-back{animation:fadeIn .16s ease}
  .modal{animation:modalPop .2s cubic-bezier(.2,.7,.3,1) both}
  .navitem{transition:background .12s,color .12s,transform .12s}
  .navitem:hover{transform:translateX(2px)}
  .chip,.stchip{transition:transform .1s}
  .tab{transition:color .12s,background .12s,border-color .12s}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function agent(id){ return USERS().find(a=>a.id===id)||{name:'Unassigned',initials:'—',role:'sales'}; }
function stageObj(id){ return state.stages.find(s=>s.id===id)||{name:id,color:'--slate'}; }
function prio(k){ return PRIO[k]||PRIO.warm; }
function isAdmin(){ return agent(state.currentUser).role==='admin'; }
function visibleLeads(){ return isAdmin()? state.leads : state.leads.filter(l=>l.agentId===state.currentUser); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(name){ return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function relFollow(iso){ if(!iso) return null; var d=new Date(iso); var now=new Date(); var diffMs=d-now; var day0=new Date(now.getFullYear(),now.getMonth(),now.getDate()); var dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var dayDiff=Math.round((dd-day0)/86400000); if(diffMs<0) return {t:'Overdue', c:'--hot'}; if(dayDiff===0) return {t:'Today', c:'--warm'}; if(dayDiff===1) return {t:'Tomorrow', c:'--cold'}; return {t:'in '+dayDiff+'d', c:'--muted'}; }
function pillPrio(k){ const P=prio(k); return `<span class="chip" style="color:var(${P.c});background:var(${P.bg})"><span class="cd" style="background:var(${P.c})"></span>${P.lbl}</span>`; }

function view_reports(){
  const leads=state.leads;
  const perAgent=USERS().map(a=>{

  const bySource={}; leads.forEach(l=>{if(!bySource[l.source])bySource[l.source]={t:0,c:0}; bySource[l.source].t++; if(l.stage==='dd')bySource[l.source].c++;});

function exportCSV(){

  visibleLeads().forEach(l=>rows.push([l.name,l.phone,l.email||'',l.property,stageObj(l.stage).name,agent(l.agentId).name,prio(l.priority).lbl,l.source,fmtDate(l.createdAt)]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{

    const a=document.createElement('a'); a.href=url; a.download='saraansh-leads.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Exported '+(rows.length-1)+' leads to CSV');
  }catch(e){ toast('Export ready ('+(rows.length-1)+' leads)'); }
}

function embedSnippet(){ return 'POST https://crm.propertysaraansh.com/api/v1/lead-capture\nContent-Type: application/json\n\n{\n  "source": "New Launch Alerts",\n  "name": "Buyer Name",\n  "phone": "98XXXXXXXX",\n  "email": "",\n  "comment": "",\n  "propertyName": "ATS Province Olympus",\n  "configuration": "3 BHK",\n  "queryType": ""\n}'; }
function copyEmbed(){ try{navigator.clipboard.writeText(embedSnippet());toast('Embed code copied');}catch(e){toast('Copy not supported here');} }
function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(ch==='\r'){} else cur+=ch; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.length&&r.some(function(c){return c.trim()!=='';});});
}

/* ---------- Property matching, dedupe, project delete ---------- */
function propBase(s){ return (s||'').toLowerCase().split('(')[0].replace(/\s+/g,' ').trim(); }
function matchProperty(name){ var b=propBase(name); if(!b)return null; return P().find(function(p){var pb=propBase(p.name); return pb&&(pb===b||pb.indexOf(b)>=0||b.indexOf(pb)>=0);})||null; }

function dedupeLeads(){
  var norm={}; var dupCount=0;
  state.leads.forEach(function(l){ if(!l.phone)return; var k=normPhone(l.phone); norm[k]=(norm[k]||0)+1; if(norm[k]===2)dupCount++; });
  var dupNums=Object.keys(norm).filter(function(k){return norm[k]>1;}).length;
  var extra=Object.keys(norm).reduce(function(a,k){return a+(norm[k]>1?norm[k]-1:0);},0);
  if(!extra){ toast('No duplicate numbers found'); return; }
  if(!confirm('Found '+dupNums+' number(s) appearing more than once ('+extra+' extra entries).\nMerge them? The most recent lead per number is kept, older ones are merged in.'))return;
  var arr=state.leads.slice().sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
  var seen={}, kept=[];
  arr.forEach(function(l){ var k=l.phone?normPhone(l.phone):('__'+l.id); if(seen[k]){ var keep=seen[k]; if(l.activities&&l.activities.length){ keep.activities=(keep.activities||[]).concat(l.activities); keep.activities.sort(function(a,b){return new Date(a.at)-new Date(b.at);}); } if(!keep.email&&l.email)keep.email=l.email; if(!keep.property&&l.property)keep.property=l.property; }
    else { seen[k]=l; kept.push(l); } });
  kept.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
  state.leads=kept; save(); render(); toast('Merged '+extra+' duplicate lead(s)');
}

/* ---------- Clean up projects ---------- */
function titleCase(s){ return (s||'').replace(/\w\S*/g,function(t){return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase();}); }
function canonKey(s){ return (s||'').toLowerCase().replace(/\s+/g,' ').replace(/[.\-–,]+$/,'').trim(); }
function cleanProjects(){
  var props=P();
  var groups={};
  props.forEach(function(pr){ var k=canonKey(pr.name); if(!k)return; (groups[k]=groups[k]||[]).push(pr); });
  var score=function(a){ return (a.snapshot&&a.snapshot.trim()?4:0)+(a.logo?2:0)+((a.brochure||a.layout||a.floorplan||a.sitemap)?1:0); };
  var canonName={}, merged=0, newProps=[];
  Object.keys(groups).forEach(function(k){ var g=groups[k].slice().sort(function(a,b){ var d=score(b)-score(a); if(d)return d; return (b.name||'').length-(a.name||'').length; }); var best=g[0];
    var nm=best.name.trim(); if(nm===nm.toLowerCase()) nm=titleCase(nm);
    g.forEach(function(pr){ if(pr!==best){ best.snapshot=best.snapshot||pr.snapshot; best.brochure=best.brochure||pr.brochure; best.layout=best.layout||pr.layout; best.floorplan=best.floorplan||pr.floorplan; best.sitemap=best.sitemap||pr.sitemap; best.logo=best.logo||pr.logo; } });
    best.name=nm; canonName[k]=nm; if(g.length>1) merged+=g.length-1; newProps.push(best);
  });
  var renamed=0;
  state.leads.forEach(function(l){ if(!l.property)return; var k=canonKey(l.property); if(canonName[k]&&l.property!==canonName[k]){ l.property=canonName[k]; renamed++; } });
  newProps.sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  if(!merged && !renamed){ toast('Projects already clean'); return; }
  if(!confirm('Merge '+merged+' duplicate project name(s) and tidy casing? '+renamed+' lead(s) will be updated to the clean names.')){ return; }
  state.properties=newProps; save(); render(); toast('Cleaned — merged '+merged+' project(s), updated '+renamed+' lead(s)');
}

/* ---------- KPI count-up ---------- */
function animateKPIs(){ if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  document.querySelectorAll('#view .kpi .k-val').forEach(function(el){ var target=parseInt((el.textContent||'').replace(/[^0-9]/g,''),10); if(isNaN(target))return; var dur=650,start=performance.now();
    function step(now){ var t=Math.min(1,(now-start)/dur); el.textContent=Math.round(target*(1-Math.pow(1-t,3))); if(t<1)requestAnimationFrame(step); }
    el.textContent='0'; requestAnimationFrame(step); }); }

/* ---------- Chrome ---------- */
function switchUser(id){ state.currentUser=id; save();
  if(route.view==='lead'){ const l=state.leads.find(x=>x.id===route.leadId); if(l&&!isAdmin()&&l.agentId!==id) route.view='leads'; }
  render(); }
function onGlobalSearch(v){ if(route.view!=='leads'&&route.view!=='lead'){ leadFilter.q=v; leadFilter.stage='all'; route.view='leads'; render(); } else { leadFilter.q=v; if(route.view==='leads') renderTableOnly(); } }
function toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme'); const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next); try{localStorage.setItem('leaddesk_theme',next);}catch(e){} }
function toggleSidebar(){ var s=document.getElementById('sidebar'); s.classList.toggle('open'); var sc=document.getElementById('scrim'); if(sc)sc.style.display=s.classList.contains('open')?'block':'none'; }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); var sc=document.getElementById('scrim'); if(sc)sc.style.display='none'; }
let toastT;
function toast(msg){ const t=document.getElementById('toast'); document.getElementById('toast-msg').textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

function renderRoleSelect(){
  const sel=document.getElementById('roleselect');
  sel.style.display=isSuperAdmin()?'':'none';
  sel.innerHTML=USERS().map(a=>`<option value="${a.id}" ${state.currentUser===a.id?'selected':''}>${a.id===state.session?a.name+' (You)':'View as '+a.name}</option>`).join('');
}

function render(){
  if(!state.session){ document.body.classList.add('auth'); renderAuth(); return; }
  document.body.classList.remove('auth');
  renderNav(); renderRoleSelect();
  const a=agent(state.currentUser);
  document.getElementById('me-av').textContent=a.initials;
  document.getElementById('me-name').textContent=a.name;
  document.getElementById('me-role').textContent=a.role==='admin'?'Administrator':'Sales Executive';

}

      <h2 style="font-size:22px">Welcome back</h2>
